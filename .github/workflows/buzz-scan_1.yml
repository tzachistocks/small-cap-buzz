name: buzz-scan

on:
  schedule:
    # UTC. US pre-market + session (~04:00-17:00 ET): every 30 minutes on weekdays
    - cron: "*/30 8-21 * * 1-5"
    # overnight snapshots, so the 7-day baseline keeps building
    - cron: "15 0,4 * * 1-5"
    # weekends: every 4 hours (Monday buzz often starts on Sunday)
    - cron: "15 */4 * * 0,6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: buzz-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Scan
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_SECRET: ${{ secrets.REDDIT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python -m scanner.main

      - name: Save data
        if: always()
        run: |
          git config user.name "buzz-bot"
          git config user.email "buzz-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "scan $(date -u +%Y-%m-%dT%H:%MZ)" -q
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
