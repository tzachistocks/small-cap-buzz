name: research-precursors

on:
  workflow_dispatch:
    inputs:
      n_tickers:
        description: "How many random US tickers to sample"
        default: "2500"
      range:
        description: "History length (1y / 2y / 5y)"
        default: "2y"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests pandas numpy
      - name: Run event study
        env:
          N_TICKERS: ${{ github.event.inputs.n_tickers }}
          RANGE: ${{ github.event.inputs.range }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scanner/precursors.py
      - name: Save report
        if: always()
        run: |
          git config user.name "buzz-bot"
          git config user.email "buzz-bot@users.noreply.github.com"
          git add data/research || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research report $(date -u +%Y-%m-%d)" -q
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
